<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Register</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    font-family: 'Segoe UI', sans-serif;
    background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
}

/* Container */
.container {
    background: #fff;
    padding: 30px;
    width: 380px;
    border-radius: 10px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.25);
}

/* Title */
.container h2 {
    text-align: center;
    margin-bottom: 20px;
    color: #2c5364;
}

/* Form group */
.form-group {
    margin-bottom: 15px;
}

/* Labels */
label {
    display: block;
    font-size: 14px;
    margin-bottom: 5px;
    color: #444;
}

/* Inputs */
input, select, textarea {
    width: 100%;
    padding: 10px;
    border-radius: 6px;
    border: 1px solid #ccc;
    font-size: 14px;
}

input:focus, select:focus, textarea:focus {
    border-color: #2c5364;
    outline: none;
}

/* Inline group (radio/checkbox) */
.inline-group {
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
}

.inline-group label {
    display: flex;
    align-items: center;
    gap: 5px;
    font-size: 13px;
}

/* Button */
button {
    width: 100%;
    padding: 12px;
    background: #2c5364;
    color: white;
    border: none;
    border-radius: 6px;
    font-size: 15px;
    cursor: pointer;
    margin-top: 10px;
    transition: 0.3s;
}

button:hover {
    background: #203a43;
}

/* Footer text */
.footer {
    margin-top: 15px;
    text-align: center;
    font-size: 13px;
}

.footer a {
    color: #2c5364;
    text-decoration: none;
    font-weight: bold;
}

.footer a:hover {
    text-decoration: underline;
}

</style>
</head>

<body>

<div class="container">

    <h2>Student Registration</h2>

    <form action="biography.html">

        <div class="form-group">
            <label>Full Name</label>
            <input type="text" placeholder="Enter your name" required>
        </div>

        <div class="form-group">
            <label>Email</label>
            <input type="email" placeholder="Enter your email" required>
        </div>

        <div class="form-group">
            <label>Password</label>
            <input type="password" placeholder="Enter password" required>
        </div>

        <div class="form-group">
            <label>Gender</label>
            <div class="inline-group">
                <label><input type="radio" name="gender"> Male</label>
                <label><input type="radio" name="gender"> Female</label>
            </div>
        </div>

        <div class="form-group">
            <label>Education</label>
            <div class="inline-group">
                <label><input type="checkbox"> 10th</label>
                <label><input type="checkbox"> Inter</label>
                <label><input type="checkbox"> Diploma</label>
                <label><input type="checkbox"> BTech</label>
            </div>
        </div>

        <div class="form-group">
            <label>Select City</label>
            <select>
                <option>Choose city</option>
                <option>Nellore</option>
                <option>Hyderabad</option>
                <option>Chennai</option>
            </select>
        </div>

        <div class="form-group">
            <label>Address</label>
            <textarea rows="3" placeholder="Enter your address"></textarea>
        </div>

        <div class="form-group">
            <label>Date of Birth</label>
            <input type="date">
        </div>

        <div class="form-group">
            <label>Upload Profile Picture</label>
            <input type="file">
        </div>

        <button type="submit">Register</button>

        <div class="footer">
            Already have an account? 
            <a href="index.html">Login</a>
        </div>

    </form>

</div>

</body>
</html>
