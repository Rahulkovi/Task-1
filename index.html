<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Home</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    font-family: 'Segoe UI', sans-serif;
    background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
    min-height: 100vh;
}

/* Navbar */
.navbar {
    width: 100%;
    background: rgba(255,255,255,0.1);
    padding: 15px 30px;
    display: flex;
    justify-content: flex-start;
    gap: 15px;
    backdrop-filter: blur(10px);
}

/* Nav buttons */
.navbar a {
    text-decoration: none;
    color: white;
    padding: 8px 15px;
    border-radius: 6px;
    background: rgba(255,255,255,0.2);
    font-size: 14px;
    transition: 0.3s;
}

.navbar a:hover {
    background: #2c5364;
}

/* Main container */
.container {
    margin: 80px auto;
    background: #fff;
    padding: 40px;
    width: 450px;
    border-radius: 12px;
    box-shadow: 0 12px 35px rgba(0,0,0,0.25);
    text-align: center;
}

/* Heading */
.container h2 {
    margin-bottom: 15px;
    color: #2c5364;
}

/* Text */
.container p {
    font-size: 14px;
    color: #555;
}

</style>
</head>

<body>

<!-- Navbar -->
<div class="navbar">
    <a href="login.html">Login</a>
    <a href="register.html">Register</a>
    <a href="biography.html">Biography</a>
</div>

<!-- Main Content -->
<div class="container">
    <h2>Welcome</h2>
</div>

</body>
</html>
