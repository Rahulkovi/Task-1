<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login</title>

    
<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    font-family: 'Segoe UI', sans-serif;
    background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
}

/* Container */
.container {
    background: #ffffff;
    padding: 35px 30px;
    width: 340px;
    border-radius: 10px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.25);
}

/* Title */
.container h2 {
    text-align: center;
    margin-bottom: 25px;
    color: #2c5364;
}

/* Form group */
.form-group {
    margin-bottom: 18px;
}

/* Labels */
label {
    font-size: 14px;
    color: #444;
    display: block;
    margin-bottom: 6px;
}

/* Inputs */
input {
    width: 100%;
    padding: 11px;
    border-radius: 6px;
    border: 1px solid #ccc;
    font-size: 14px;
    transition: 0.2s;
}

input:focus {
    border-color: #2c5364;
    outline: none;
}

/* Forgot password */
.forgot {
    display: block;
    text-align: right;
    font-size: 13px;
    margin-bottom: 15px;
    color: #2c5364;
    text-decoration: none;
}

.forgot:hover {
    text-decoration: underline;
}

/* Button */
button {
    width: 100%;
    padding: 12px;
    background: #2c5364;
    color: white;
    border: none;
    border-radius: 6px;
    font-size: 15px;
    cursor: pointer;
    transition: 0.3s;
}

button:hover {
    background: #203a43;
}

/* Register text */
.register {
    margin-top: 18px;
    text-align: center;
    font-size: 13px;
}

.register a {
    color: #2c5364;
    text-decoration: none;
    font-weight: bold;
}

.register a:hover {
    text-decoration: underline;
}

</style>
</head>

<body>

<div class="container">

    <h2>Login</h2>

    <form action="biography.html">

        <div class="form-group">
            <label>Email</label>
            <input type="email" placeholder="Enter your email" required>
        </div>

        <div class="form-group">
            <label>Password</label>
            <input type="password" placeholder="Enter your password" required>
        </div>

        <a href="#" class="forgot">Forgot Password?</a>

        <button type="submit">Login</button>

        <div class="register">
            Don't have an account? 
            <a href="register.html">Register</a>
        </div>

    </form>

</div>

</body>
</html>
