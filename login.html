<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Page</title>
</head>
<style>

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: linear-gradient(120deg, #141e30, #243b55);
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
}

/* Container */
.container {
    background: #ffffff;
    padding: 30px;
    width: 320px;
    border-radius: 12px;
    box-shadow: 0 8px 20px rgba(0,0,0,0.3);
    text-align: left;
}

/* Title */
h2 {
    text-align: center;
    margin-bottom: 20px;
    color: #243b55;
}

/* Labels */
label {
    font-size: 14px;
    color: #333;
}

/* Inputs */
input {
    width: 100%;
    padding: 10px;
    margin-top: 5px;
    margin-bottom: 15px;
    border-radius: 6px;
    border: 1px solid #ccc;
}

input:focus {
    border-color: #243b55;
    outline: none;
}

/* Forgot link */
.forgot {
    font-size: 13px;
    text-decoration: none;
    color: #243b55;
}

.forgot:hover {
    text-decoration: underline;
}

/* Button */
button {
    width: 100%;
    padding: 10px;
    background: #243b55;
    color: white;
    border: none;
    border-radius: 6px;
    margin-top: 10px;
    cursor: pointer;
}

button:hover {
    background: #141e30;
}

p {
    font-size: 13px;
    text-align: center;
}

</style>
<body>

    <h2>Login</h2>

    <form action="biography.html">

        <div>
            <label>Email:</label><br>
            <input type="email" placeholder="Enter your email" required>
        </div>

        <br>

        <div>
            <label>Password:</label><br>
            <input type="password" placeholder="Enter your password" required>
        </div>

        <br>

        <a href="#">Forgot Password?</a>

        <p>
            Don't have an account?
            <a href="index.html">Register here</a>
        </p>

        <button type="submit">Login</button>

    </form>

</body>
</html>
